schema_version = "1.3"
source = "ProgramGym"
artifacts = [
  "/logs/verifier/programgym_eval.json",
  "/logs/verifier/harbor_diagnostics.json",
  "/logs/verifier/programgym_eval.log",
  "/logs/verifier/reward.json",
  "/logs/verifier/reward.txt",
  # Keep agent/runtime state out of the submission handoff. In particular,
  # Claude Code installs an absolute symlink under .local/bin; transferring it
  # makes Python's safe tar extraction reject the entire workspace archive.
  { source = "/workspace", exclude = [
    "executable",
    ".git",
    ".bashrc",
    ".cache",
    ".cc-switch",
    ".claude",
    ".local",
  ] },
]

